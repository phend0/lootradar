name: LootRadar
options:
  bundleIdPrefix: com.lootradar
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.lootradar.ios
    MARKETING_VERSION: 2.5.0
    CURRENT_PROJECT_VERSION: 25
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  LootRadar:
    type: application
    platform: iOS
    sources:
      - path: LootRadar
        excludes:
          - www/**
      - path: LootRadar/www
        type: folder
    info:
      path: LootRadar/Info.plist
